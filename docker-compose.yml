name: nobojatra

# Postgres is NOT run here — point DATABASE_URL / DATABASE_URL_OWNER in .env at the
# host database. From these containers the host is `host.docker.internal` (mapped
# below), e.g. postgresql+asyncpg://nobojatra_app:pw@host.docker.internal:5432/nobojatra
# Provision the two roles + database first: see docker/postgres-init.sh.

services:
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_URL}
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
    volumes:
      - ntfydata:/var/lib/ntfy
    ports: ["8080:80"]

  migrate:
    build:
      context: .
      network: host
    command: uv run alembic upgrade head
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  api:
    build:
      context: .
      network: host
    env_file: .env
    environment:
      NTFY_URL: http://ntfy:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      network: host
      args:
        VITE_API_BASE: /api
    ports: ["80:80"]
    depends_on:
      api:
        condition: service_started
    # TLS: terminate at a load balancer / a second nginx in front, or add a certs
    # volume + listen 443 here. App assumes it is served over https in prod.

volumes:
  ntfydata:

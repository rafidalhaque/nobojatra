name: nobojatra

# Postgres is NOT run here — use a Dokploy-managed Postgres and set DATABASE_URL /
# DATABASE_URL_OWNER in the Dokploy Environment tab to its internal hostname, e.g.
# postgresql+asyncpg://nobojatra_app:pw@<pg-app-name>:5432/nobojatra
# The Dokploy DB user is the schema owner; add the runtime role once with
# docker/postgres-init.sh. Attach this stack to the DB's network if it is not shared.
# Deploy via Dokploy: add a Domain on `web` (port 80); no host ports are published.

services:
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_URL}
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
    volumes:
      - ntfydata:/var/lib/ntfy
    expose:
      - 80

  migrate:
    build:
      context: .
    command: uv run alembic upgrade head
    networks: [default, dokploy-network]
    env_file: .env
    restart: "no"

  api:
    build:
      context: .
    env_file: .env
    environment:
      NTFY_URL: http://ntfy:80
    networks: [default, dokploy-network]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    networks: [default, dokploy-network]
    depends_on:
      api:
        condition: service_started
    # TLS: terminated by Traefik (Dokploy). App assumes https in prod.

networks:
  # Dokploy's shared network: reaches the managed Postgres and lets Traefik route to `web`.
  # For local `docker compose up`, run `docker network create dokploy-network` once.
  dokploy-network:
    external: true

volumes:
  ntfydata:

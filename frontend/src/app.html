<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Nobojatra</title>
    <script>
      // Set theme + language before first paint. Pre-login there is no profile to
      // read, so follow the OS (spec 12.2). No storage is touched.
      try {
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var bn = (navigator.language || 'en').toLowerCase().startsWith('bn');
        document.documentElement.lang = bn ? 'bn' : 'en';
      } catch (e) {}
    </script>
    <style>
      /* Critical shell — paints instantly on slow links, before the JS bundle. */
      :root {
        --paper: #eef0ec; --ink: #1a1e1a; --board: #14352a; --rule: #c9c8be;
      }
      :root[data-theme='dark'] {
        --paper: #10140f; --ink: #e6e7de; --board: #0b1f18; --rule: #2a322a;
      }
      html, body { margin: 0; background: var(--paper); color: var(--ink); }
      body { font-family: 'Carlito', 'Calibri', 'Segoe UI', system-ui, sans-serif; }
      #shell-mast {
        background: var(--board); color: #f3f2ea;
        padding: 14px 20px; display: flex; align-items: baseline; gap: 12px;
        border-bottom: 3px double rgba(243, 242, 234, 0.35);
      }
      #shell-mast b { font-weight: 700; letter-spacing: 0.04em; font-size: 1.05rem; }
      #shell-mast span { font-size: 0.9rem; opacity: 0.7; }
      #shell-wait {
        display: flex; align-items: center; justify-content: center;
        min-height: 40vh; font-size: 0.95rem; opacity: 0.55; letter-spacing: 0.03em;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">
      <header id="shell-mast">
        <b>নবযাত্রা</b><span>Nobojatra · internal board</span>
      </header>
      <div id="shell-wait">লোড হচ্ছে… · Loading…</div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

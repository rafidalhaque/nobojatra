server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API — same origin as the app so the auth cookie stays first-party.
    # The API sets its own Cache-Control: no-store on content responses.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;   # spec 5: no upload size limit
        proxy_request_buffering off;
    }

    # Content-hashed build assets — safe to cache hard (code, not data).
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML entrypoints must revalidate so app updates land immediately.
    location = /login.html { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # SPA fallback: prerendered pages win, otherwise hand off to the client router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
